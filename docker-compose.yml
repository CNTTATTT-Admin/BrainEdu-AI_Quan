version: '3.8'

services:
  # Database: MySQL
  mysql:
    image: mysql:8.0
    container_name: brainedu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d

  # Cache: Redis
  redis:
    image: redis:7-alpine
    container_name: brainedu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend: Java Spring Boot
  # Backend: Java Spring Boot
  backend:
    build: ./BrainEduBackend
    container_name: brainedu-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend: ReactJS
  frontend:
    build: ./BrainEduFrontend
    container_name: brainedu-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./BrainEduFrontend:/app  
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  redis_data: