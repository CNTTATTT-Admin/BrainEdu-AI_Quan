spring.application.name=BrainEdu

# Database: Ưu tiên biến SPRING_DATASOURCE_URL từ Docker, mặc định là localhost:3307 cho Terminal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/brainedu?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate 8 Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT: Ưu tiên lấy từ môi trường để bảo mật, tránh lộ key thật trên Git
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}
spring.data.redis.host=localhost
#spring.data.redis.port=6379
#logging.level.root=ERROR
#logging.level.com.brainedu=DEBUG