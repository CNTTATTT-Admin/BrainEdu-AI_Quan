# Database: Ưu tiên biến SPRING_DATASOURCE_URL từ Docker, mặc định là localhost:3307 cho Terminal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/brainedu?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
